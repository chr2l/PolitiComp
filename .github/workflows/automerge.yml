name: Auto-merge Claude PRs
# Fusionne automatiquement les PR des branches claude/* poussées DANS CE DÉPÔT
# (seules les personnes ayant le droit d'écrire ici peuvent créer ces branches).
# Les PR venant d'un fork (contributions extérieures) ne sont JAMAIS fusionnées
# automatiquement : l'éditeur les relit et les fusionne à la main.
# Les brouillons attendent d'être marqués « prêts ».
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
